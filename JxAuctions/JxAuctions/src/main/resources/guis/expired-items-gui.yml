title: "&0Expired Items (%current_page%/%max_page%)"
rows: 6
page-size: 36

filler:
  slot: ["0-8", "45-53"]
  material: "ORANGE_STAINED_GLASS_PANE"
  name: " "

back:
  slot: 45
  material: "BARRIER"
  name: "&#FF3333&lBack"
  actions:
    - "[MENU] my-items"
    - "[SOUND] ui.button.click|1|1"

previous-page:
  slot: 48
  material: "ARROW"
  conditions:
    - "%current_page% > 1"
  name: "&#00DDFF&lPrevious Page"
  actions:
    - "[PAGE] previous"

refresh:
  slot: 49
  material: "SUNFLOWER"
  name: "&#00DDFF&lRefresh"
  actions:
    - "[REFRESH]"

next-page:
  slot: 50
  material: "ARROW"
  conditions:
    - "%current_page% < %max_page%"
  name: "&#00DDFF&lNext Page"
  actions:
    - "[PAGE] next"
