title: "&0My Items (%current_page%/%max_page%)"
rows: 6
page-size: 36

filler:
  slot: ["0-8", "45-53"]
  material: "LIGHT_BLUE_STAINED_GLASS_PANE"
  name: " "

back:
  slot: 45
  material: "BARRIER"
  name: "&#FF3333&lBack"
  lore:
    - " &7Return to Auction House"
  actions:
    - "[MENU] main"
    - "[SOUND] ui.button.click|1|1"

previous-page:
  slot: 48
  material: "ARROW"
  conditions:
    - "%current_page% > 1"
  name: "&#00DDFF&lPrevious Page"
  actions:
    - "[PAGE] previous"
    - "[SOUND] ui.button.click|1|1"

refresh:
  slot: 49
  material: "SUNFLOWER"
  name: "&#00DDFF&lRefresh"
  actions:
    - "[REFRESH]"
    - "[SOUND] ui.button.click|1|1"

next-page:
  slot: 50
  material: "ARROW"
  conditions:
    - "%current_page% < %max_page%"
  name: "&#00DDFF&lNext Page"
  actions:
    - "[PAGE] next"
    - "[SOUND] ui.button.click|1|1"

expired-items:
  slot: 53
  material: "CLOCK"
  conditions:
    - "%expired_items_enabled% == true"
  name: "&#00DDFF&lExpired Items"
  lore:
    - " &fView your expired items (%expired_count%)"
  actions:
    - "[MENU] expired-items"
    - "[SOUND] ui.button.click|1|1"
