title: "&0Admin Logs (%current_page%/%max_page%)"
rows: 6
page-size: 36

filler:
  slot: ["0-8", "45-53"]
  material: "GRAY_STAINED_GLASS_PANE"
  name: " "

back:
  slot: 45
  material: "BARRIER"
  name: "&#FF3333&lClose"
  actions:
    - "[CLOSE]"

previous-page:
  slot: 48
  material: "ARROW"
  conditions:
    - "%current_page% > 1"
  name: "&#00DDFF&lPrevious Page"
  actions:
    - "[PAGE] previous"

refresh:
  slot: 49
  material: "SUNFLOWER"
  name: "&#00DDFF&lRefresh"
  actions:
    - "[REFRESH]"

next-page:
  slot: 50
  material: "ARROW"
  conditions:
    - "%current_page% < %max_page%"
  name: "&#00DDFF&lNext Page"
  actions:
    - "[PAGE] next"
