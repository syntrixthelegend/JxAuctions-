placeholder-currencies:
  Example-Currency:
    register: false
    uses-double: true
    works-offline: false
    tax: 0
    settings:
      raw-placeholder: "%vault_eco_balance_fixed%"
      give-command: "eco give %player% %amount%"
      take-command: "eco take %player% %amount%"
    display:
      raw: "Money"
      gui: "&#FCD34D%price% &#94A3B8money"
    item:
      material: "EMERALD"
      name: "&#34D399&lMoney"
      lore:
        - "&#94A3B8List your item using server money."
        - " "
        - "&#10B981▸ Click to choose this currency"

