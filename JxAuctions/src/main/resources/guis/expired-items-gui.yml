title: "&8Expired Items &7(%current_page%/%max_page%)"
rows: 6
page-size: 36

filler:
  slot: ["0-8", "45-53"]
  material: "ORANGE_STAINED_GLASS_PANE"
  name: " "

back:
  slot: 45
  material: "ARROW"
  name: "&#F87171&l← Back to My Listings"
  lore:
    - "&#94A3B8Return to your active listings."
  actions:
    - "[MENU] my-items"
    - "[SOUND] ui.button.click|1|1"

previous-page:
  slot: 48
  material: "ARROW"
  conditions:
    - "%current_page% > 1"
  name: "&#34D399&l← Previous Page"
  actions:
    - "[PAGE] previous"

refresh:
  slot: 49
  material: "SUNFLOWER"
  name: "&#FCD34D&lRefresh"
  actions:
    - "[REFRESH]"

next-page:
  slot: 50
  material: "ARROW"
  conditions:
    - "%current_page% < %max_page%"
  name: "&#34D399&lNext Page →"
  actions:
    - "[PAGE] next"
